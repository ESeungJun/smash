<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Smash!</title>
    <link rel="stylesheet" href="smash.css" />
  </head>
  <!-- 정리 버튼을 누르면 화면 맨 위에 잠깐 뜨는 투명 창. 마우스 입력은 통과시킨다.
       손바닥이 크게 나타났다가 "찰싹!!" 내리친다. 내리치는 순간(0.8초)에 정리가 실행된다. -->
  <body>
    <div class="stage">
      <div class="flash"></div>
      <div class="ring"></div>
      <div class="ring late"></div>
      <svg class="hand" viewBox="-330 -300 600 560" aria-hidden="true">
        <!-- 앱 아이콘과 같은 손바닥. 빨간 외곽선만 보이도록 테두리용 사본을 뒤에 깔고 흰 손을 위에 얹는다. -->
        <defs>
          <g id="palm">
            <rect x="-150" y="-228" width="68" height="300" rx="34" />
            <rect x="-75" y="-272" width="68" height="340" rx="34" />
            <rect x="0" y="-256" width="68" height="330" rx="34" />
            <rect x="75" y="-196" width="64" height="270" rx="32" />
            <rect x="-36" y="-220" width="72" height="230" rx="36" transform="translate(-118 120) rotate(-40)" />
            <path d="M-150 -10 H139 V110 Q139 230 20 230 H-30 Q-150 230 -150 110 Z" />
          </g>
        </defs>
        <use href="#palm" class="outline" />
        <use href="#palm" class="fill" />
      </svg>
      <div class="word kwang">찰싹!!</div>
    </div>
    <script src="smash.js"></script>
  </body>
</html>
